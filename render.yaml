services:
  - type: web
    name: backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    startCommand: uvicorn main:app --host 0.0.0.0 --port 8000

  - type: web
    name: frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production