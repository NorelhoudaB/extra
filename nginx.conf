events {}

http {
  server {
    listen 80;
    server_name amelkis-ai.ddns.net;

    # Frontend
    location / {
      proxy_pass http://frontend:8911;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Backend API
    location /api/ {
      proxy_pass http://backend:80/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}